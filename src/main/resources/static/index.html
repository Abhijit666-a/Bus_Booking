<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusBooking | Modern Travel Booking</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="navbar">
        <div class="nav-container">
            <nav>
                <ul class="nav-links">
                    <li>
                        <a href="#" class="nav-link">
                            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 12 10s-6.7.6-8.5 1.1C2.7 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2" />
                                <path d="M22 10V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v4" />
                                <circle cx="6.5" cy="17.5" r="2.5" />
                                <circle cx="17.5" cy="17.5" r="2.5" />
                            </svg>
                            <span>Bus Tickets</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="4" y="3" width="16" height="16" rx="2" ry="2" />
                                <path d="M4 11h16" />
                                <path d="M12 3v8" />
                                <path d="m8 19-2 3" />
                                <path d="m18 22-2-3" />
                                <path d="M8 15h.01" />
                                <path d="M16 15h.01" />
                            </svg>
                            <span>Train Tickets</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 4v16" />
                                <path d="M2 8h18a2 2 0 0 1 2 2v10" />
                                <path d="M2 17h20" />
                                <path d="M6 8v9" />
                            </svg>
                            <span>Hotels</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="nav-right">
                <a href="#" class="account-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Account</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero-banner">
            <!-- Parallax Hero Image using user-provided CSS classes and animation -->
            <img src="assets/index_image.png" alt="" aria-hidden="true" class="TzjDcCME" loading="eager"
                data-reveal-bound="1" data-reveal="loaded">

            <div class="banner-content">
                <h1>Pocket friendly, Verified stays</h1>
                <p>
                    <svg class="thumbs-up-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3">
                        </path>
                    </svg>
                    Verified reviews &amp; ratings
                </p>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <div class="search-item border-right">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <div class="input-group">
                            <label>City, area or hotel name</label>
                            <input type="text" value="" placeholder="Enter city" />
                        </div>
                    </div>
                    <div class="search-item border-right">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <div class="input-group">
                            <label>Check in</label>
                            <input type="text" value="" placeholder="Select date" />
                        </div>
                    </div>
                    <div class="search-item border-right">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <div class="input-group">
                            <label>Check out</label>
                            <input type="text" value="" placeholder="Select date" />
                        </div>
                    </div>
                    <div class="search-item">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <div class="input-group">
                            <label>No. of rooms &amp; guests</label>
                            <input type="text" value="" placeholder="Rooms & Guests" />
                        </div>
                    </div>
                </div>
                <button class="search-btn">Search hotels</button>
            </div>
        </section>

        <section class="flash-deals">
            <!-- Space for gradient background as in screenshot -->
            <div class="deals-content">
            </div>
        </section>
    </main>
</body>

</html>
